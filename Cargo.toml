[workspace]
members = [
    "flodown", "flodown-ir",
    "markdown-lite",
    "parser-utils",
    "test",
]
exclude = ["test"]
resolver = "2"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--html-in-header",
    "resources/katex-header.html",
    "--html-in-header",
    "resources/flams-docs.html",
    "--enable-index-page",
    "-Zunstable-options",
    "--generate-link-to-definition",
]

[profile.release]
panic = "abort"
codegen-units = 1
overflow-checks = false
split-debuginfo = "packed"
strip = "symbols"
opt-level = 'z'
lto = true
incremental = true

[workspace.dependencies]
console_error_panic_hook = "0.1"
tracing-wasm = { version = "0.2" }
document-features = "0.2"
serde-value = "0.7"
serde_yml = "0.0.12"
thiserror = "2"
#toml = "0.9"
tracing = "0.1"
html-escape = "0.2"
url = "2.5"
rustc-hash = "2"
serde = {version="1", features=["derive","rc"]}
smallvec = "2.0.0-alpha.10"
tracing-subscriber = {version = "0.3", features = ["smallvec","parking_lot","json"]}
either= "1"
leptos = "0.8"
wasm-bindgen = "^0.2.106"
tsify = { version = "0.5", features = ["js"] }
parking_lot = "0.12"

parser-utils = { path = "parser-utils"}
flodown = { path = "flodown"}
markdown-lite = { path = "markdown-lite"}

ftml-uris = { git = "https://github.com/FlexiFormal/FTML", features = ["interned"] }
ftml-ontology = { git = "https://github.com/FlexiFormal/FTML", features = ["interned"] }
ftml-parser = { git = "https://github.com/FlexiFormal/FTML", features = ["interned"] }
ftml-components = { git = "https://github.com/FlexiFormal/FTML", features = ["interned"] }
ftml-dom = { git = "https://github.com/FlexiFormal/FTML", features = ["interned"] }
ftml-viewer = { git = "https://github.com/FlexiFormal/FTML", features = ["interned"] }

#ftml-uris = {path="../FTML/uris", features = ["interned"]}
#ftml-ontology = {path="../FTML/ontology"}
#ftml-parser = {path="../FTML/parser"}
#ftml-components = {path="../FTML/components"}
#ftml-dom = {path="../FTML/dom"}
#ftml-viewer = {path="../FTML/viewer"}

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.lints.clippy.enum_glob_use]
level = "allow"
priority = 0

[workspace.lints.clippy.module_name_repetitions]
level = "allow"
priority = 0

[workspace.lints.clippy.nursery]
level = "warn"
priority = 2

[workspace.lints.clippy.pedantic]
level = "warn"
priority = 1

[workspace.lints.clippy.redundant_else]
level = "warn"
priority = 1

[workspace.lints.clippy.similar_names]
level = "warn"
priority = 1

[workspace.lints.clippy.too_many_lines]
level = "warn"
priority = 1

[profile.bench]
strip = "none"

[replace]
"serde-lite:0.5.1" = { git = 'https://github.com/Jazzpirate/serde-lite',branch="hashmaps" }
